<script>
(() => {
    const flash = document.getElementById("flash");
    const flashWidth = 35;
    const flashHeight = 38;
    let previousX = -1;
    let previousY = -1;

    const randomBetween = (min, max) => min + Math.random() * (max - min);

    function showNextFlash() {
        const areaWidth = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
        const areaHeight = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
        const maxX = Math.max(0, areaWidth - flashWidth);
        const maxY = Math.max(0, areaHeight - flashHeight);

        let x = 0;
        let y = 0;

        // Pick a new position across the full width. Reject positions too
        // close to the previous flash so flashes spread around the marked area.
        for (let attempt = 0; attempt < 14; attempt++) {
            x = Math.round(randomBetween(0, maxX));

            // Bias the vertical position toward the lower part of the area.
            const lowerBias = Math.pow(Math.random(), 0.62);
            y = Math.round(maxY * (0.12 + lowerBias * 0.78));

            if (
                previousX < 0 ||
                Math.hypot(
                    (x - previousX) / Math.max(areaWidth, 1),
                    (y - previousY) / Math.max(areaHeight, 1)
                ) > 0.18
            ) {
                break;
            }
        }

        previousX = x;
        previousY = y;

        flash.style.left = x + "px";
        flash.style.top = y + "px";
        flash.style.opacity = "1";

        // One flash at a time, with a variable pause before the next one.
        const visibleFor = randomBetween(150, 270);
        window.setTimeout(() => {
            flash.style.opacity = "0";
            window.setTimeout(showNextFlash, randomBetween(430, 1550));
        }, visibleFor);
    }

    showNextFlash();
})();
</script>
