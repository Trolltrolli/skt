<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEED A BODÍKY POTĚŠÍ</title>
<style>
html,body{width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:90%;height:220px;transform:translate(-50%,-50%);overflow:hidden}
.seed-text{position:absolute;left:0;top:50%;white-space:nowrap;font-family:Arial,Helvetica,sans-serif;font-size:40px;font-weight:900;letter-spacing:.06em;color:#164b91;-webkit-text-stroke:.7px #000;text-shadow:2px 2px 0 #000;animation:seedX 9s linear infinite alternate,seedY 1.4s ease-in-out infinite alternate}
@keyframes seedX{from{left:0;transform:translateX(0)}to{left:100%;transform:translateX(-100%)}}
@keyframes seedY{from{top:15%;}to{top:70%;}}
</style>
</head>
<body>
<div class="stage"><div class="seed-text">SEED A BODÍKY POTĚŠÍ</div></div>
</body>
</html>
