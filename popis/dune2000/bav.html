<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAV SE</title>
<style>
html,body{width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden}
.marquee{position:absolute;left:0;top:0;width:100%;white-space:nowrap;overflow:hidden}
.marquee p{display:inline-block;margin:0;padding:8px 0;font-family:Arial,Helvetica,sans-serif;font-size:40px;font-weight:900;letter-spacing:.06em;color:#ff28c9;-webkit-text-stroke:.7px #000;text-shadow:2px 2px 0 #000;animation:bavMove 14s linear infinite}
@keyframes bavMove{0%{transform:translateX(-100%)}100%{transform:translateX(100vw)}}
</style>
</head>
<body>
<div class="marquee"><p>BAV SE!</p></div>
</body>
</html>
