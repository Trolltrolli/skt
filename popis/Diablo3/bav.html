<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diablo III – BAV SE</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:76px;margin:0;background:transparent!important;overflow:hidden}
.stage{position:relative;width:100%;height:76px;overflow:hidden}
.banner{position:absolute;top:50%;left:0;width:200px;max-width:48vw;height:auto;transform:translate(-120%,-50%);animation:dia3Bav 15s linear infinite;filter:drop-shadow(0 2px 4px #000)}
@keyframes dia3Bav{0%{transform:translate(-120%,-50%)}100%{transform:translate(calc(100vw + 220px),-50%)}}
</style>
</head>
<body>
<div class="stage"><img class="banner" src="./dia3_bav.png" alt="BAV SE"></div>
</body>
</html>
