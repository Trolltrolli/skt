<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diablo III – SEED</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100px;margin:0;background:transparent!important;overflow:hidden}
.stage{position:relative;width:100%;height:100px;overflow:hidden}
.banner{position:absolute;left:0;top:50%;width:450px;max-width:78vw;height:auto;transform:translate(-115%,-50%);animation:dia3Seed 19s linear infinite,dia3SeedFloat 1.8s ease-in-out infinite alternate;filter:drop-shadow(0 2px 5px #000)}
@keyframes dia3Seed{0%{left:0;transform:translate(-115%,-50%)}100%{left:100%;transform:translate(0,-50%)}}
@keyframes dia3SeedFloat{0%{margin-top:-9px}100%{margin-top:9px}}
</style>
</head>
<body>
<div class="stage"><img class="banner" src="./dia3_seed.png" alt="SEED a bodíky potěší"></div>
</body>
</html>
