<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Player</title>

<style>
*{box-sizing: border-box}
html,body{margin: 0; width: 100%; height: 128px; overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif; color: #e6e9ed}
.player{width: 940px; max-width: 100%; height: 128px; padding: 12px 16px; border: 1px solid #555b63; border-radius: 10px; background: linear-gradient(145deg, #30343a, #17191d 65%, #101114); box-shadow: 0 0 20px 8px #000; display: flex; flex-direction: column; justify-content: center; gap: 12px; overflow: hidden}
.top{display: flex; align-items: center; gap: 10px; min-width: 0; pointer-events: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.disc{width: 29px; height: 29px; flex: 0 0 29px; border-radius: 50%; border: 2px solid #777f89; background: radial-gradient(circle, #222 0 16%, var(--accent) 18% 24%, #252a30 26% 58%, #626a74 60% 63%, #1b1e22 65%); box-shadow: 0 0 8px #000; pointer-events: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.meta{min-width: 0; flex: 1; pointer-events: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.name{font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .03em; pointer-events: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.controls{display: flex; align-items: center; gap: 9px; width: 100%; min-width: 0}
.btn{width: 28px; height: 27px; flex: 0 0 28px; border: 1px solid #59616b; border-radius: 6px; background: linear-gradient(#3c424a, #24282e); color: #f4f5f7; font-size: 13px; cursor: pointer; padding: 0; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.btn:hover{background: linear-gradient(#515964, #2b3037); border-color: var(--accent)}
.btn:active{transform: translateY(1px)}
.time{font-size: 10px; color: #aeb5be; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.seek{flex: 1; min-width: 30px; accent-color: var(--accent); height: 4px; cursor: pointer}
.vol{width: 75px; flex: 0 1 75px; min-width: 40px; accent-color: var(--accent); height: 4px; cursor: pointer}
.volume-icon{font-size: 12px; color: #bfc5cd; white-space: nowrap; pointer-events: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
input{margin: 0}
button,input{outline: none}
button:focus-visible,input:focus-visible{outline: 1px solid var(--accent); outline-offset: 2px}
</style>
</head>

<body>

<div class="player" style="--accent: #d66a20;">
  <div class="top">
    <div class="disc"></div>
    <div class="meta">
      <div class="name" id="trackName">Theme music</div>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="playBtn" title="Přehrát / pozastavit" aria-label="Přehrát">▶</button>
    <span class="time" id="current">0:00</span>
    <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Pozice skladby">
    <span class="time" id="duration">0:00</span>
    <span class="volume-icon">VOL</span>
    <input class="vol" id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Hlasitost">
    <button class="btn" id="muteBtn" title="Ztlumit / zapnout zvuk" aria-label="Ztlumit">♪</button>
  </div>
</div>

<audio id="audio" src="audio.mp3" preload="auto" autoplay muted loop></audio>

<script>
(function(){var a=document.getElementById('audio'),p=document.getElementById('playBtn'),m=document.getElementById('muteBtn'),v=document.getElementById('volume'),s=document.getElementById('seek'),c=document.getElementById('current'),d=document.getElementById('duration'),n=document.getElementById('trackName');a.volume=.75;a.loop=true;function fmt(x){if(!isFinite(x)||x<0)return'0:00';var mm=Math.floor(x/60),ss=Math.floor(x%60);return mm+':'+(ss<10?'0':'')+ss;}function syncPlay(){p.textContent=a.paused?'▶':'Ⅱ';p.setAttribute('aria-label',a.paused?'Přehrát':'Pozastavit');}function play(){if(a.paused){var q=a.play();if(q&&q.catch)q.catch(function(){});}else a.pause();}p.onclick=play;m.onclick=function(){a.muted=!a.muted;m.textContent=a.muted?'×':'♪';m.title=a.muted?'Zapnout zvuk':'Ztlumit';};v.oninput=function(){a.volume=Number(v.value);if(a.volume>0&&a.muted){a.muted=false;m.textContent='♪';m.title='Ztlumit';}};a.addEventListener('play',syncPlay);a.addEventListener('pause',syncPlay);a.addEventListener('loadedmetadata',function(){d.textContent=fmt(a.duration);});a.addEventListener('durationchange',function(){d.textContent=fmt(a.duration);});a.addEventListener('timeupdate',function(){c.textContent=fmt(a.currentTime);if(isFinite(a.duration)&&a.duration>0&&!s._dragging)s.value=Math.round(a.currentTime/a.duration*1000);});s.addEventListener('input',function(){s._dragging=true;if(isFinite(a.duration)&&a.duration>0){var t=(Number(s.value)/1000)*a.duration;c.textContent=fmt(t);}});s.addEventListener('change',function(){if(isFinite(a.duration)&&a.duration>0)a.currentTime=(Number(s.value)/1000)*a.duration;s._dragging=false;});a.addEventListener('ended',function(){syncPlay();s.value=0;});fetch('./name.txt?ts=' + Date.now(), { cache: 'no-store' }).then(function(r) {
  if (!r.ok) throw new Error('name.txt nelze načíst: ' + r.status);
  return r.text();
}).then(function(t) {
  var lines = t.replace(/\r/g, '').split('\n');
  var title = (lines[0] || '').trim();
  var accent = (lines[1] || '').trim();
  if (title) n.textContent = title;
  if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(accent)) {
    document.querySelector('.player').style.setProperty('--accent', accent);
  }
}).catch(function(e) {
  console.warn('Nepodařilo se načíst name.txt. Při otevření přes file:// to prohlížeč může blokovat; otevři přehrávač přes HTTP/HTTPS.', e);
});function startLikeNfs(){a.muted=false;m.textContent='♪';m.title='Ztlumit';var q=a.play();if(q&&q.catch)q.catch(function(){});}if(a.readyState>=2){startLikeNfs();}else{a.addEventListener('canplay',startLikeNfs,{once:true});a.load();}})();
</script>

</body>
</html>
