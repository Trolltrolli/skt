<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000; }
    body { font-family: Arial, sans-serif; }
    .player {
      width: 100%;
      min-height: 90px;
      padding: 8px;
      color: #fff;
      background: #222;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,.5);
      text-align: center;
    }
    .title { margin: 0 0 8px; font-size: 14px; }
    audio { display: block; width: 100%; height: 36px; }
  </style>
</head>
<body>
  <div class="player">
    <p class="title">Theme music</p>
    <audio id="audioPlayer" controls autoplay preload="auto" src="audio.mp3">
      Váš prohlížeč nepodporuje přehrávání audia.
    </audio>
  </div>
</body>
</html>
