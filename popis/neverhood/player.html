<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">



<title>Audio Player</title>

<style>
*{box-sizing: border-box}
html,body{margin: 0; width: 100%; height: 128px; overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif; color: #e6e9ed}
/* ÚPRAVA: Zde jsem povolil pointer-events a přidal kurzor ruky, aby celá maketa fungovala jako spouštěcí tlačítko */
.player{width: 940px; max-width: 100%; height: 128px; padding: 12px 16px; border: 1px solid #3a3c40; border-radius: 10px; background: linear-gradient(145deg, #30343a, #17191d 65%, #101114); box-shadow: 0 0 20px 8px #000; display: flex; flex-direction: column; justify-content: center; gap: 12px; overflow: hidden; pointer-events: auto; cursor: pointer; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.top{display: flex; align-items: center; gap: 10px; min-width: 0; pointer-events: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.disc{width: 29px; height: 29px; flex: 0 0 29px; border-radius: 50%; border: 2px solid #777f89; background: radial-gradient(circle, #222 0 16%, var(--accent) 18% 24%, #252a30 26% 58%, #626a74 60% 63%, #1b1e22 65%); box-shadow: 0 0 8px #000}
.meta{min-width: 0; flex: 1; pointer-events: none}
.name{font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .03em; pointer-events: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none}
.controls{display: flex; align-items: center; gap: 9px; width: 100%; min-width: 0; pointer-events: none}
.btn{width: 28px; height: 27px; flex: 0 0 28px; border: 1px solid #59616b; border-radius: 6px; background: linear-gradient(#3c424a, #24282e); color: #f4f5f7; font-size: 13px; cursor: default; padding: 0; pointer-events: none; user-select: none; -webkit-user-select: none}
.time{font-size: 10px; color: #aeb5be; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; user-select: none; -webkit-user-select: none}
.seek{flex: 1; min-width: 30px; accent-color: var(--accent); height: 4px; pointer-events: none; user-select: none}
.vol{width: 75px; flex: 0 1 75px; min-width: 40px; accent-color: var(--accent); height: 4px; pointer-events: none; user-select: none}
.volume-icon{font-size: 12px; color: #bfc5cd; white-space: nowrap; pointer-events: none; user-select: none; -webkit-user-select: none}
input{margin: 0; pointer-events: none}
#playerContainer{width: 940px; max-width: 100%; height: 128px}
#playerContainer iframe{display: block; width: 940px; max-width: 100%; height: 128px; border: 0; border-radius: 10px}
</style>
</head>

<body>

<div id="playerContainer">
  <div class="player" id="fPlayer" style="--accent:#ffffff">
    <div class="top">
      <div class="disc"></div>
      <div class="meta">
        <div class="name" id="trackName">Theme music</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" type="button" tabindex="-1" aria-hidden="true">▶</button>
      <span class="time">0:00</span>
      <input class="seek" type="range" min="0" max="1000" value="0" tabindex="-1" aria-hidden="true">
      <span class="time">--:--</span>
      <span class="volume-icon">VOL</span>
      <input class="vol" type="range" min="0" max="1" step="0.01" value="0.75" tabindex="-1" aria-hidden="true">
      <button class="btn" type="button" tabindex="-1" aria-hidden="true">♪</button>
    </div>
  </div>
</div>

<script>
(function(){
  var TIMEOUT=5000;
  var container=document.getElementById('playerContainer');
  var fake=document.getElementById('fPlayer');
  var finished=false;

  fetch('./name.txt?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){
      if(!r.ok)throw new Error('name.txt: '+r.status);
      return r.text();
    })
    .then(function(t){
      var lines=t.replace(/\r/g,'').split('\n');
      var title=(lines[0]||'').trim();
      var accent=(lines[1]||'').trim();

      if(title)document.getElementById('trackName').textContent=title;

      if(/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(accent)){
        fake.style.setProperty('--accent',accent);
      }
    })
    .catch(function(e){
      console.warn('Nepodařilo se načíst name.txt.',e);
    });

  function loadRealPlayer() {
    if(finished)return;
    finished=true;

    var iframe=document.createElement('iframe');
    iframe.src='./player_audio.html?autoplay=true';
    iframe.allow='autoplay';
    iframe.title='Audio Player';
    container.replaceChildren(iframe);
  }
  setTimeout(loadRealPlayer, TIMEOUT);
  fake.addEventListener('click', function() {
    loadRealPlayer();
  }, { once: true });

})();
</script>

</body>
</html>
