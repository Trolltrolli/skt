<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:128px;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;color:#e6e9ed}
.player{width:940px;max-width:100%;height:128px;padding:12px 16px;border:1px solid #3a3c40;border-radius:10px;background:linear-gradient(145deg,#30343a,#17191d 65%,#101114);box-shadow:0 0 20px 8px #000;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;min-width:0;pointer-events:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none}
.disc{width:29px;height:29px;flex:0 0 29px;border-radius:50%;border:2px solid #777f89;background:radial-gradient(circle,#222 0 16%,var(--accent) 18% 24%,#252a30 26% 58%,#626a74 60% 63%,#1b1e22 65%);box-shadow:0 0 8px #000;pointer-events:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none}
.meta{min-width:0;flex:1;pointer-events:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none}
.name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em;pointer-events:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none}
.controls{display:flex;align-items:center;gap:9px;width:100%;min-width:0}
.btn{width:28px;height:27px;flex:0 0 28px;border:1px solid #59616b;border-radius:6px;background:linear-gradient(#3c424a,#24282e);color:#f4f5f7;font-size:13px;cursor:pointer;padding:0;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none}
.btn:hover{background:linear-gradient(#515964,#2b3037);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.time{font-size:10px;color:#aeb5be;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none}
.seek{flex:1;min-width:30px;accent-color:var(--accent);height:4px;cursor:pointer}
.vol{width:75px;flex:0 1 75px;min-width:40px;accent-color:var(--accent);height:4px;cursor:pointer}
.volume-icon{font-size:12px;color:#bfc5cd;white-space:nowrap;pointer-events:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none}
input{margin:0}button,input{outline:none}button:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
#playerContainer{width:940px;max-width:100%;height:128px;position:relative}
#fakePlayer{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#fakePlayer .controls,#fakePlayer button,#fakePlayer input{pointer-events:none}
#realPlayer{display:none}
</style>
</head>
<body>
<div id="playerContainer">
  <div class="player" id="fakePlayer" style="--accent:#ffffff" role="button" tabindex="0" aria-label="Spustit přehrávač">
    <div class="top"><div class="disc"></div><div class="meta"><div class="name trackName">Theme music</div></div></div>
    <div class="controls"><button class="btn" type="button" tabindex="-1" aria-hidden="true">▶</button><span class="time">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" tabindex="-1" aria-hidden="true"><span class="time">--:--</span><span class="volume-icon">VOL</span><input class="vol" type="range" min="0" max="1" step="0.01" value="0.75" tabindex="-1" aria-hidden="true"><button class="btn" type="button" tabindex="-1" aria-hidden="true">♪</button></div>
  </div>
  <div class="player" id="realPlayer" style="--accent:#ffffff">
    <div class="top"><div class="disc"></div><div class="meta"><div class="name trackName">Theme music</div></div></div>
    <div class="controls"><button class="btn" id="playBtn" title="Přehrát / pozastavit" aria-label="Přehrát">▶</button><span class="time" id="current">0:00</span><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Pozice skladby"><span class="time" id="duration">0:00</span><span class="volume-icon">VOL</span><input class="vol" id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Hlasitost"><button class="btn" id="muteBtn" title="Ztlumit / zapnout zvuk" aria-label="Ztlumit">♪</button></div>
  </div>
</div>
<audio id="audio" src="audio.mp3" preload="auto" loop></audio>
<script>
(function(){
var TIMEOUT=5000,done=false;
var fake=document.getElementById('fakePlayer'),real=document.getElementById('realPlayer'),a=document.getElementById('audio');
var p=document.getElementById('playBtn'),m=document.getElementById('muteBtn'),v=document.getElementById('volume'),s=document.getElementById('seek'),c=document.getElementById('current'),d=document.getElementById('duration');
a.volume=.75;
function fmt(x){if(!isFinite(x)||x<0)return'0:00';var mm=Math.floor(x/60),ss=Math.floor(x%60);return mm+':'+(ss<10?'0':'')+ss;}
function syncPlay(){p.textContent=a.paused?'▶':'Ⅱ';p.setAttribute('aria-label',a.paused?'Přehrát':'Pozastavit');}
function syncMute(){m.textContent=a.muted?'×':'♪';m.title=a.muted?'Zapnout zvuk':'Ztlumit';m.setAttribute('aria-label',m.title);}

var userImpulseReceived = false;

// Funkce pro zachycení interakce (kliknutí nebo dotyk/interakce mimo player uvnitř iframe)
function registerImpulse(e){
    if(!done && !fake.contains(e.target)){
        userImpulseReceived = true;
    }
}

document.addEventListener('click', registerImpulse);
// Místo neposedného pointermove používáme pointerdown (reálný stisk/interakce), 
// který iframe i prohlížeče akceptují jako plnohodnotný spouštěč zvuku.
document.addEventListener('pointerdown', registerImpulse, { once: true });

function showReal(fromClick){
    if(!done){
        done=true;
        fake.style.display='none';
        real.style.display='flex';
    }
    // Pokud proběhl přímý klik nebo uživatel kdekoli v iframe interagoval (klik/dotyk)
    if(fromClick || userImpulseReceived){
        a.muted=false;
        syncMute();
    }else if(a.muted){
        a.muted=false;
        syncMute();
    }
    var q=a.play();
    if(q&&q.catch){
        q.catch(function(){
            a.muted = true;
            syncMute();
            var q2 = a.play();
            if(q2 && q2.catch) q2.catch(function(){});
        });
    }
}

// Přímý klik na fakePlayer
fake.addEventListener('click',function(){showReal(true);});
fake.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();showReal(true);}});

// Časovač pro automatické přepnutí po limitu
setTimeout(function(){
    showReal(false);
},TIMEOUT);

p.onclick=function(){if(a.paused){var q=a.play();if(q&&q.catch)q.catch(function(){});}else a.pause();};
m.onclick=function(){a.muted=!a.muted;syncMute();if(!a.paused&&!a.muted){var q=a.play();if(q&&q.catch)q.catch(function(){});}};
v.oninput=function(){a.volume=Number(v.value);if(a.volume>0&&a.muted){a.muted=false;syncMute();}};
a.addEventListener('play',syncPlay);a.addEventListener('pause',syncPlay);
a.addEventListener('loadedmetadata',function(){d.textContent=fmt(a.duration);});
a.addEventListener('durationchange',function(){d.textContent=fmt(a.duration);});
a.addEventListener('timeupdate',function(){c.textContent=fmt(a.currentTime);if(isFinite(a.duration)&&a.duration>0&&!s._dragging)s.value=Math.round(a.currentTime/a.duration*1000);});
s.addEventListener('input',function(){s._dragging=true;if(isFinite(a.duration)&&a.duration>0)c.textContent=fmt(Number(s.value)/1000*a.duration);});
s.addEventListener('change',function(){if(isFinite(a.duration)&&a.duration>0)a.currentTime=Number(s.value)/1000*a.duration;s._dragging=false;});
a.addEventListener('ended',function(){syncPlay();s.value=0;});
fetch('./name.txt?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('name.txt nelze načíst: '+r.status);return r.text();}).then(function(t){var lines=t.replace(/\r/g,'').split('\n'),title=(lines[0]||'').trim(),accent=(lines[1]||'').trim();if(title)document.querySelectorAll('.trackName').forEach(function(el){el.textContent=title;});if(/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(accent))document.querySelectorAll('.player').forEach(function(el){el.style.setProperty('--accent',accent);});}).catch(function(e){console.warn('Nepodařilo se načíst name.txt.',e);});
syncPlay();syncMute();
})();
</script>
</body>
</html>
