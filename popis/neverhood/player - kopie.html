<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){
      try{
        if(!sessionStorage.getItem('player_refreshed')){
          sessionStorage.setItem('player_refreshed','1');
          setTimeout(function(){
            location.replace('player.html?r=1');
          },700);
        }
      }catch(e){
        location.replace('player.html?r=1');
      }
    })();
  </script>

  <title>Audio Player</title>
  <style>
    body {
      margin: 0;
      background-color: black;
    }
    .player {
      width: 940px;
      height: 128px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 0 20px 10px black;
    }
  </style>
</head>
<body>

<div id="playerContainer"></div>

<script>
  const PRIMARY_URL = "";
  const BACKUP_URL = "./player_audio.html?autoplay=true";
  const TIMEOUT = 5000;

  const container = document.getElementById('playerContainer');
  let mp3Ok = false;

  function loadIframe(src) {
    const iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.allow = "autoplay";
    iframe.className = "player";
    container.innerHTML = "";
    container.appendChild(iframe);
  }

  // Spustíme přehrávač
  loadIframe(PRIMARY_URL);

  // Posloucháme zprávy z embed playeru
  window.addEventListener("message", (event) => {
    if (event.data?.mp3_status === "ok") {
      console.log("");
      mp3Ok = true;
    }
  });

  // Po timeoutu zkontrolujeme, jestli nepřišla zpráva
  setTimeout(() => {
    if (!mp3Ok) {
      console.log("");
      loadIframe(BACKUP_URL);
    }
  }, TIMEOUT);
</script>

</body>
</html>
