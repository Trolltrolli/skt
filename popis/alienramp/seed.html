<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEED A BODÍKY POTĚŠÍ</title>
<style>
html,body{width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:90%;height:220px;transform:translate(-50%,-50%);overflow:hidden}
.seed-text{position:absolute;left:0;top:0;white-space:nowrap;font-family:Rockwell,Arial,Helvetica,sans-serif;font-size:40px;font-weight:900;letter-spacing:.15em;color:#d15c08;-webkit-text-stroke:.2px #000;text-shadow:1px 1px 0 #000,0 0 4px #000;will-change:transform;animation:seedX 9s linear infinite alternate,seedY 1.4s ease-in-out infinite alternate}
@keyframes seedX{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--travel-x),0,0)}}
@keyframes seedY{from{top:15%}to{top:70%}}
</style>
</head>
<body>
<div class="stage"><div class="seed-text">SEED A BODÍKY POTĚŠÍ</div></div>
<script>
const stage=document.querySelector('.stage'),text=document.querySelector('.seed-text');
function setTravel(){text.style.setProperty('--travel-x',`${Math.max(0,stage.clientWidth-text.scrollWidth)}px`)}
setTravel();addEventListener('resize',setTravel,{passive:true});
</script>
</body>
</html>
