<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=VT323">
  <title>DOSstation</title>
</head>
<body>
  <div class="pcd-viewport">
    <div class="pcd-stage">
      <div class="pccase">
        <div class="screen oldscreeneffect">
          <div class="screentext">
            <p><marquee behavior="scroll" direction="left" scrollamount="5">&nbsp;SKtorrent&nbsp;&nbsp;&nbsp;&nbsp;DOSbox daum - directx emulator</marquee>
              ________________________________________________________________</p>
            <p style="margin-top:343px">C:&gt;LINK<input class="screentext" autofocus></p>
          </div>
        </div>
        <div class="pccaselower">
          |||||||||
          <div class="pccaseonoffbutton">
            <div class="innercirclecase">
              <div class="innerlinecase"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="cpu">
        <div class="pcbaseleft">
          <div class="logo"><font size="50">DOSstation</font><br>|||||||||</div>
          <div class="onoffbutton">
            <div class="innercircle">
              <div class="innerline"></div>
            </div>
          </div>
          <div class="onoffled"></div>
        </div>

        <!-- Pad3 placement intentionally stays as it was. -->
        <img src="../pad3.png" alt="" style="position:absolute; margin-left:-232px; margin-top:63px; transform:rotate(6deg)">
        <img src="../button.png" alt="" width="55.5" height="45"
             onmouseover="this.src='../button.png';"
             onmouseout="this.src='../button.png';"
             style="position:absolute; margin-top:36.5px; margin-left:-106.5px; opacity:.4">

        <div class="pcbaseright">
          <div class="disquette">
            <div class="disqueteline"></div>
            <div class="disquetesquare"></div>
          </div>
          <div class="disquette">
            <div class="disqueteline"></div>
            <div class="disquetesquare"></div>
          </div>
        </div>
      </div>

      <img class="pad4" src="../pad4.png" alt="">
      <img class="pad1" src="../pad.png" alt="">
      <img class="pad2" src="../pad2.png" alt="">
    </div>
  </div>

  <script>
    (function () {
      const viewport = document.querySelector('.pcd-viewport');
      const stage = document.querySelector('.pcd-stage');
      const baseWidth = 1000;
      const baseHeight = 910;

      function fitStage() {
        const availableWidth = viewport.clientWidth || baseWidth;
        const scale = Math.min(1, availableWidth / baseWidth);
        stage.style.left = ((availableWidth - baseWidth * scale) / 2) + 'px';
        stage.style.transform = 'scale(' + scale + ')';
        viewport.style.height = (baseHeight * scale) + 'px';
      }

      fitStage();
      if ('ResizeObserver' in window) {
        new ResizeObserver(fitStage).observe(viewport);
      } else {
        window.addEventListener('resize', fitStage);
      }
    })();
  </script>
</body>
</html>
